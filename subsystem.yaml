name: software-project-risk
conformance_level: L3

# Frontend is the subsystem gateway. Auth/API traffic is proxied to backend.
base_url: http://localhost:3201
core_hub_url: http://localhost:3000
core_hub_web_url: http://localhost:3100
callback_path: /auth/callback

public_endpoints:
  - GET /api/health
  - GET /auth/login
  - GET /auth/callback
  - POST /auth/logout

probes:
  collection: /api/v1/projects
  not_found: /api/v1/projects/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/projects/not-a-uuid
  create:
    path: /api/v1/projects
    allowed_role: staff
    denied_role: student
    invalid_body:
      name: ""
    valid_body:
      name: Conformance Probe
      description: Standards conformance probe
      startDate: 2026-01-01
      endDate: 2026-01-10
      budget: 10000
      teamSize: 2
      status: PLANNING

display_name: "Software Project Risk"
repo: github.com/supawadeeboonsa/SoftwareProjectRisk
status: proposed
