name: csmju-software-project-risk
services:
  db:
    image: postgres:16-alpine
    container_name: csmju-software-project-risk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: software_project_risk
    ports:
      - '5433:5432'
    volumes:
      - csmju-software-project-risk-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d software_project_risk']
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csmju-software-project-risk-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/software_project_risk
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      CORE_HUB_URL: ${CORE_HUB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-https://csmju2030.jowave.com}
      CORE_HUB_JWKS_URL: ${CORE_HUB_JWKS_URL:-https://csmju2030.jowave.com/api/v1/.well-known/jwks.json}
      CORE_HUB_ISSUER: ${CORE_HUB_ISSUER:-core-hub}
      CORE_HUB_AUDIENCE: ${CORE_HUB_AUDIENCE:-csmju2030}
      SUBSYSTEM_ID: ${SUBSYSTEM_ID:-csmju-software-project-risk}
      SUBSYSTEM_NAME: ${SUBSYSTEM_NAME:-Software Project Risk}
      TZ: ${TZ:-Asia/Bangkok}
    expose:
      - '4000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://api:4000
        CORE_HUB_WEB_URL: https://csmju2030.jowave.com
    container_name: csmju-software-project-risk-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CORE_HUB_WEB_URL: https://csmju2030.jowave.com
      SUBSYSTEM_ID: csmju-software-project-risk
      TZ: Asia/Bangkok
    ports:
      - '3232:3000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - 'no-new-privileges:true'
    tmpfs:
      - /tmp:size=32m
      - /app/frontend/.next/cache:size=64m
    healthcheck:
      test:
        - 'CMD'
        - 'node'
        - '-e'
        - "require('net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  csmju-software-project-risk-db-data:
